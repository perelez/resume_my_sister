<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anastasia Novikova | Spatial Creative Director</title>
  </head>
  <body>
    <div id="app">
      
      <header class="hero-section">
        <video class="hero-video" autoplay loop muted playsinline>
          <source src="/hero-video.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <h1 class="hero-title">ANASTASIA NOVIKOVA</h1>
          <p class="hero-subtitle">Spatial Creative Director / Architect</p>
        </div>
      </header>

      <section class="interactive-section">
        <div class="interactive-container">
          
          <svg class="lines-canvas" id="linesCanvas"></svg>
          
          <div class="model-wrapper" id="centerModel">
            <img src="/center-model.png" alt="Model" class="center-model" />
          </div>

          <div class="project-node node-1" data-project="1">
            <img src="/projects/p1.jfif" alt="Project 1" />
          </div>
          <div class="project-node node-2" data-project="2">
            <img src="/projects/p2.jfif" alt="Project 2" />
          </div>
          <div class="project-node node-3" data-project="3">
            <img src="/projects/p3.jfif" alt="Project 3" />
          </div>
          <div class="project-node node-4" data-project="4">
            <img src="/projects/p4.jfif" alt="Project 4" />
          </div>
          <div class="project-node node-5" data-project="5">
            <img src="/projects/p5.jfif" alt="Project 5" />
          </div>
          <div class="project-node node-6" data-project="6">
            <img src="/projects/p6.jfif" alt="Project 6" />
          </div>
          <div class="project-node node-7" data-project="7">
            <img src="/projects/p7.jfif" alt="Project 7" />
          </div>
          <div class="project-node node-8" data-project="8">
            <img src="/projects/p8.jfif" alt="Project 8" />
          </div>

          <div class="project-tooltip" id="projectTooltip">
            <button class="tooltip-close">&times;</button>
            <h3 class="tooltip-title">Название проекта</h3>
            <p class="tooltip-desc">Краткое описание</p>
            <a href="#" class="tooltip-btn">Далее →</a>
          </div>

        </div>
      </section>

      <section class="archive-section">
        <div class="archive-container">
          <div class="archive-header">
            <h2 class="archive-title">Архив проектов</h2>
            <p class="archive-subtitle">Полное портфолио по годам</p>
          </div>

          <div class="archive-grid">
            <a href="/projects/project-1.html" target="_blank" class="grid-item">
              <div class="item-image-wrapper">
                <img src="/projects/p1.jfif" alt="Project 1" />
              </div>
              <div class="item-info">
                <span class="item-year">2026</span>
                <span class="item-name">Театр Света</span>
              </div>
            </a>
            <a href="/projects/project-2.html" target="_blank" class="grid-item">
              <div class="item-image-wrapper">
                <img src="/projects/p2.jfif" alt="Project 2" />
              </div>
              <div class="item-info">
                <span class="item-year">2025</span>
                <span class="item-name">Павильон 'Гексагон'</span>
              </div>
            </a>
            <a href="/projects/project-3.html" target="_blank" class="grid-item">
              <div class="item-image-wrapper">
                <img src="/projects/p3.jfif" alt="Project 3" />
              </div>
              <div class="item-info">
                <span class="item-year">2025</span>
                <span class="item-name">Реконструкция Завода</span>
              </div>
            </a>
            <a href="/projects/project-4.html" target="_blank" class="grid-item">
              <div class="item-image-wrapper">
                <img src="/projects/p4.jfif" alt="Project 4" />
              </div>
              <div class="item-info">
                <span class="item-year">2024</span>
                <span class="item-name">Жилой Квартал 'Эко-Лайн'</span>
              </div>
            </a>
          </div>
        </div>
      </section>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
